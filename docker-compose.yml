services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: ai_scientist_postgres
    environment:
      POSTGRES_DB: ai_scientist
      POSTGRES_USER: ai_scientist
      POSTGRES_PASSWORD: ai_scientist_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/init_postgres.sql:/docker-entrypoint-initdb.d/init_postgres.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ai_scientist -d ai_scientist"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis/redis-stack:latest
    container_name: ai_scientist_redis
    ports:
      - "6379:6379"
      - "8001:8001"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
  redis_data:
